<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>續集預告舞台</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Noto Serif TC","Songti TC",serif;color:#ece8df}
.L{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .6s}
.L.on{opacity:1}
#sk{width:70vw;height:70vh}
#sk svg{width:100%;height:100%;overflow:visible}
#sk .pn{fill:none;stroke:#ece8df;stroke-width:1.5}
#pf{position:fixed;inset:0;overflow:hidden}
#pf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;filter:grayscale(1) blur(10px) brightness(.25);transform:scale(1.2);transition:filter 2s cubic-bezier(.3,.6,.2,1),transform 9s cubic-bezier(.2,.6,.3,1)}
#pf.dev img{filter:none;transform:scale(1.04)}
#pf::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 30%,transparent 50%,rgba(0,0,0,.85))}
.crop{position:fixed;inset:0;overflow:hidden}
.crop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.9);transition:transform 2.2s ease-out}
.crop.go img{transform:scale(2.15)}
#num{flex-direction:column;gap:2vh;background:rgba(0,0,0,.55)}
#num b{font:400 22vh/1 "Iowan Old Style",Palatino,Georgia,serif;color:var(--c)}
#num span{font-size:3vh;color:#ece8df;max-width:70vw;text-align:center;line-height:1.5}
#tt{flex-direction:column;gap:2.4vh;text-align:center}
#tt .k{font:400 2.4vh ui-monospace,Menlo,monospace;letter-spacing:.4em;color:var(--c)}
#tt h1{margin:0;font-size:7vh;line-height:1.3;max-width:84vw;letter-spacing:.04em}
#end{flex-direction:column;gap:1.8vh;text-align:center}
#end .f{font-size:5vh;font-weight:700;letter-spacing:.14em}
#end .s{font:400 2.2vh ui-monospace,Menlo,monospace;letter-spacing:.35em;color:var(--c)}
#end img{width:18vw;margin-top:3vh;opacity:.85}
#cap{position:fixed;left:6vw;top:7vh;font:400 3vh "Iowan Old Style",Palatino,Georgia,serif;letter-spacing:.1em;color:#cfc9bd;opacity:0;transition:opacity .5s;z-index:9}
#cap.on{opacity:1}
#sub{position:fixed;left:0;right:0;bottom:8vh;text-align:center;font-size:4.2vh;font-weight:700;letter-spacing:.06em;line-height:1.5;padding:0 8vw;color:#f4efe4;text-shadow:0 2px 14px #000,0 0 30px #000;opacity:0;transition:opacity .4s;z-index:9}
#sub.on{opacity:1}
#white{position:fixed;inset:0;background:#fff;opacity:0;transition:opacity .9s;z-index:20;pointer-events:none}
#white.on{opacity:.8;transition:none}
#fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:5;mix-blend-mode:screen;opacity:0;transition:opacity .8s;pointer-events:none}
#sk .pn{stroke:var(--c)!important;filter:drop-shadow(0 0 6px var(--c))}
#scL{background:radial-gradient(ellipse at 50% 55%,color-mix(in srgb,var(--c) 14%,#000),#000 70%)}
#sc{width:62vw;transform:scale(.92);transition:transform 3.6s cubic-bezier(.2,.6,.2,1)}#scL.on #sc{transform:scale(1.06)}
#sc svg{width:100%;height:auto;overflow:visible}#sc .pn{fill:none;stroke:var(--c);stroke-width:1.6;filter:drop-shadow(0 0 5px var(--c))}#sc text{fill:var(--c);stroke:none}
#chL{flex-direction:column;gap:2.2vh;text-align:center;background:#000}
#chL .no{font:400 2.4vh ui-monospace,Menlo,monospace;letter-spacing:.5em;color:var(--c)}
#chL .nm{font-size:8.4vh;font-weight:700;letter-spacing:.08em;transform:scale(1.08);transition:transform .6s ease-out}#chL.on .nm{transform:scale(1)}
#chL .bar{width:0;height:2px;background:var(--c);transition:width .5s ease-out}#chL.on .bar{width:22vw}
#pf .sweep{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-100%);transition:transform 2.6s ease-in-out .8s}
#pf.dev .sweep{transform:translateX(100%)}
#pf.dev img{transform:scale(1.04);transition:filter 2s cubic-bezier(.3,.6,.2,1),transform 6s ease-out}#pf.dev.z img{transform:scale(1.16)}
#qL{background:#000}#qL .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(24px) brightness(.28);transform:scale(1.2)}
#qL q{position:relative;quotes:none;font-size:5.6vh;font-weight:700;line-height:1.55;max-width:74vw;text-align:center;letter-spacing:.04em}
#qL q::before{content:"";display:block;width:6vw;height:2px;background:var(--c);margin:0 auto 4vh}
#qL q i{font-style:normal;opacity:0;transition:opacity .15s}#qL q i.v{opacity:1}
.crop.gl img{animation:gl .45s steps(3) both}
@keyframes gl{0%{filter:hue-rotate(80deg) saturate(2);transform:scale(2) translateX(-2%)}33%{filter:none;transform:scale(2.05) translateX(1.5%)}66%{filter:contrast(1.6) brightness(1.3);transform:scale(2.1) translateX(-.6%)}100%{filter:none;transform:scale(2.12)}}
.crop::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px)}
#tt{background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--c) 10%,#000) 0%,#000 65%)}
#tt h1{text-shadow:0 0 40px color-mix(in srgb,var(--c) 50%,transparent)}
#end{background:#000}
#sA{background:#000;overflow:hidden}#sA img{width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform 4.2s cubic-bezier(.2,.6,.2,1)}#sA.on img{transform:scale(1.12) translateX(-1.5%)}
#chL .cbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.38) saturate(.9);transform:scale(1.08);transition:transform .9s ease-out}#chL.on .cbg{transform:scale(1)}
#chL .no,#chL .nm,#chL .bar{position:relative}#chL .nm{text-shadow:0 2px 30px #000}
</style>
<script src="../../data.js"></script>
<script src="../../sketch.js"></script>
<script src="../../score.js"></script>
<script src="../../stories.js"></script>
<script src="../../scene.js"></script>
<script src="fx.js"></script>
</head>
<body>
<canvas id="fx"></canvas>
<div class="L" id="skL"><div id="sk"></div></div>
<div class="L" id="scL"><div id="sc" class="midsk live"></div></div>
<div class="L" id="sA"><img alt=""></div>
<div class="L" id="chL"><div class="cbg"></div><div class="no"></div><div class="nm"></div><div class="bar"></div></div>
<div class="L" id="qL"><div class="bg"></div><q></q></div>
<div class="L" id="pfL"><div id="pf"></div></div>
<div class="L" id="c1"><div class="crop"></div></div>
<div class="L" id="c2"><div class="crop"></div></div>
<div class="L" id="num"><b></b><span></span></div>
<div class="L" id="tt"><div class="k"></div><h1></h1></div>
<div class="L" id="end"><div class="f"></div><div class="s">2026 續集　即將上映</div><img src="../../img/logo/mark-dark.svg" alt=""></div>
<div id="cap"></div><div id="sub"></div><div id="white"></div>
<script>
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0'), W=ms=>new Promise(r=>setTimeout(r,ms));
const ACC={1:'#6FB6FF',2:'#E07A5F',3:'#FF4F9A',4:'#E8B04A',5:'#C9A46A',6:'#59D4A0',7:'#9DB8FF',8:'#FF5FD2',9:'#5B9BE0',10:'#FF8A2A',11:'#E07A2B',12:'#3DFF7A',13:'#C46B1C',14:'#FF5A4E',15:'#B48AD6',16:'#5FA8E0',17:'#C9B34A',18:'#FFD84D',19:'#B39C72',20:'#D8D5CE',21:'#C9874A',22:'#E04A3A'};
let ac;
function on(id){ document.querySelectorAll('.L.on').forEach(l=>{ if(l.id!==id) l.classList.remove('on'); }); if(id) $(id).classList.add('on'); }
function sub(t){ const e=$('sub'); if(t){ e.textContent=t; e.classList.add('on'); } else e.classList.remove('on'); }
function cap(t){ const e=$('cap'); if(t){ e.textContent=t; e.classList.add('on'); } else e.classList.remove('on'); }
function white(){ const w=$('white'); w.classList.add('on'); requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.remove('on'))); }
function boom(t=0,f=44,v=.9){ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.setValueAtTime(f*2,ac.currentTime+t); o.frequency.exponentialRampToValueAtTime(f,ac.currentTime+t+.5);
  g.gain.setValueAtTime(0,ac.currentTime+t); g.gain.linearRampToValueAtTime(v,ac.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+2.4); o.connect(g); g.connect(ac.destination); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+2.6); }
function hit(t=0,v=.35){ const n=ac.createBufferSource(), b=ac.createBuffer(1,ac.sampleRate*.25,ac.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  n.buffer=b; const g=ac.createGain(); g.gain.value=v; n.connect(g); g.connect(ac.destination); n.start(ac.currentTime+t); }
function draw(box,total){ const els=[...box.querySelectorAll('.pn')];
  els.forEach((el,i)=>{ let L=300; try{L=Math.ceil(el.getTotalLength())||300}catch(e){} el.style.strokeDasharray=L; el.style.strokeDashoffset=L;
    el.style.transition=`stroke-dashoffset ${total*.6}ms cubic-bezier(.5,.1,.3,1) ${Math.round(i/Math.max(1,els.length)*total*.5)}ms`; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>els.forEach(el=>el.style.strokeDashoffset=0))); }

const fxo=v=>{ $('fx').style.opacity=v; };
async function run(n,hook){
  const a=DATA.find(x=>x.n===n), st=STORIES[n], img=`../../img/poster/${pad(n)}.webp`, C=ACC[n]||'#e8d4a2';
  document.documentElement.style.setProperty('--c',C);
  // 劇情版裡的電影感素材：中場插圖的動畫 CSS、章名、一句金句
  try{ const css=await (await fetch('../../style.css')).text(); const keep=css.split('\n').filter(l=>/^\.midsk(\.live|\s+g\[class\])|^@keyframes a-/.test(l)).join('\n'); const el=document.createElement('style'); el.textContent=keep; document.head.appendChild(el); }catch(e){}
  const lines=st.text.split('\n');
  const chs=lines.filter(l=>l.startsWith('## ')).map(l=>l.slice(3)).filter(t=>!/前情提要|尾聲|終章|終卷/.test(t));
  const pick=[chs[Math.floor(chs.length*.2)],chs[Math.floor(chs.length*.5)],chs[Math.floor(chs.length*.8)]].filter((v,i,ar)=>v&&ar.indexOf(v)===i).slice(0,3);
  const quotes=lines.filter(l=>l.startsWith('> ')).map(l=>l.slice(2).trim()).filter(q=>q.length>=8&&q.length<=30);
  const quote=(quotes.find(q=>!/\d/.test(q))||quotes[0]||'');
  const [h1,h2]=(()=>{ const i=hook.indexOf('。'); return i>0?[hook.slice(0,i+1),hook.slice(i+1)]:[hook,'']; })();
  const numLine=(lines.find(l=>l.startsWith('NUM: '))||'').slice(5).split('｜');
  const seqTitle=(st.title.split('：')[1]||a.title);
  $('pf').innerHTML=`<img src="${img}" alt=""><div class="sweep"></div>`;
  $('c1').firstElementChild.innerHTML=`<img src="${img}" style="object-position:30% 28%" alt="">`;
  $('c2').firstElementChild.innerHTML=`<img src="${img}" style="object-position:72% 40%" alt="">`;
  $('qL').querySelector('.bg').style.backgroundImage=`url(${img})`;
  $('qL').querySelector('q').innerHTML=[...quote].map(c=>`<i>${c}</i>`).join('');
  $('tt').querySelector('.k').textContent=`《${a.film.zh}》　${a.film.year} — 2026`;
  $('tt').querySelector('h1').textContent=seqTitle;
  $('end').querySelector('.f').textContent=`《${a.film.zh}》`;
  if(numLine[0]){ $('num').querySelector('b').textContent=numLine[0]; $('num').querySelector('span').textContent=numLine[1]||''; }
  $('sc').innerHTML=window.SCENE?window.SCENE(n):'';
  // 場景圖（img/scene/NN-a/b/c.webp）：有就用，沒有就沿用中場插圖線稿
  const SC=await Promise.all(['a','b','c'].map(x=>new Promise(r=>{ const i=new Image(); i.onload=()=>r(i.src); i.onerror=()=>r(null); i.src=`../../img/scene/${pad(n)}-${x}.webp`; })));
  const hasSc=!!SC[0];   // 只有一張時，章名底圖改用同一張的不同局部
  if(SC[0]) $('sA').querySelector('img').src=SC[0];
  if(SC[2]||SC[0]) $('qL').querySelector('.bg').style.backgroundImage=`url(${SC[2]||SC[0]})`;
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
  FX.start($('fx'),n,C);
  ac=new AudioContext(); SCORE.play(n,ac,.6);
  // 0–3：片種特效＋鉛筆分鏡
  $('sk').innerHTML=window.SKETCH(n); const sv=$('sk').querySelector('svg'); sv.removeAttribute('class'); sv.removeAttribute('width'); sv.removeAttribute('height');
  fxo(.9); on('skL'); cap(`${a.film.year}　《${a.film.zh}》`); draw($('sk'),2200); await W(2900);
  // 3–6：中場插圖動起來＋原片結局
  if(SC[0]){ hit(0,.25); on('sA'); fxo(.3); sub(h1); await W(3100); sub(''); }
  else { hit(0,.25); on('scL'); draw($('sc'),1800); fxo(.55); sub(h1); await W(3100); sub(''); }
  // 6–8：章名快剪
  fxo(.85); cap('');
  const bgs=[SC[1]||SC[0],SC[2]||SC[0],SC[0]], crop=['22% 30%','78% 62%','50% 45%'], one=!SC[1]&&!SC[2];
  for(const [k,c] of pick.entries()){ const m=c.split('｜'); $('chL').querySelector('.no').textContent=m.length>1?m[0]:''; $('chL').querySelector('.nm').textContent=m[m.length-1];
    { const cb=$('chL').querySelector('.cbg'); cb.style.backgroundImage=hasSc&&bgs[k]?`url(${bgs[k]})`:'none'; cb.style.backgroundSize=one?'190%':'cover'; cb.style.backgroundPosition=one?crop[k]:'center'; }
    $('chL').classList.remove('on'); void $('chL').offsetWidth; hit(0,.45); on('chL');
    if(hasSc){ await W(760); } else { await W(560); on('c'+(k%2+1)); $('c'+(k%2+1)).firstElementChild.classList.add('gl'); await W(130); } }
  // 8–11.6：海報顯影＋懸疑
  fxo(.35); on('pfL'); requestAnimationFrame(()=>requestAnimationFrame(()=>{ $('pf').classList.add('dev'); setTimeout(()=>$('pf').classList.add('z'),200); })); await W(500);
  sub(h2); await W(3300); sub('');
  // 11.6–13.4：金句逐字
  if(quote){ fxo(.6); on('qL'); const cs=[...$('qL').querySelectorAll('i')]; for(let i=0;i<cs.length;i++){ cs[i].classList.add('v'); await W(Math.min(55,1000/cs.length)); } await W(900); }
  // 13.4–14.6：關鍵數字或快切
  if(numLine[0]){ hit(0,.5); fxo(.4); on('num'); await W(1300); }
  else { hit(0,.4); on('c1'); $('c1').firstElementChild.classList.remove('gl'); void $('c1').offsetWidth; $('c1').firstElementChild.classList.add('gl'); await W(450); hit(0,.4); on('c2'); await W(450); }
  // 14.6–17.4：續集片名
  boom(0,42,1); white(); fxo(.9); on('tt'); await W(2800);
  // 17.4–20：片尾
  on('end'); fxo(.5); await W(2300); SCORE.stop(false); fxo(0); await W(700);
  window.__done=true;
}
window.__start=async()=>{ const n=+new URLSearchParams(location.search).get('n')||12;
  const src=await (await fetch('../../app.js')).text(); const HOOK=JSON.parse(src.match(/const HOOK=(\{.*?\});/)[1]);
  run(n,HOOK[n]); };
</script>
</body>
</html>
