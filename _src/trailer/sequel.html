<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>續集預告舞台</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Noto Serif TC","Songti TC",serif;color:#ece8df}
.L{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .6s}
.L.on{opacity:1}
#sk{width:70vw;height:70vh}
#sk svg{width:100%;height:100%;overflow:visible}
#sk .pn{fill:none;stroke:#ece8df;stroke-width:1.5}
#pf{position:fixed;inset:0;overflow:hidden}
#pf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;filter:grayscale(1) blur(10px) brightness(.25);transform:scale(1.2);transition:filter 2s cubic-bezier(.3,.6,.2,1),transform 9s cubic-bezier(.2,.6,.3,1)}
#pf.dev img{filter:none;transform:scale(1.04)}
#pf::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 30%,transparent 50%,rgba(0,0,0,.85))}
.crop{position:fixed;inset:0;overflow:hidden}
.crop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.9);transition:transform 2.2s ease-out}
.crop.go img{transform:scale(2.15)}
#num{flex-direction:column;gap:2vh;background:rgba(0,0,0,.55)}
#num b{font:400 22vh/1 "Iowan Old Style",Palatino,Georgia,serif;color:var(--c)}
#num span{font-size:3vh;color:#ece8df;max-width:70vw;text-align:center;line-height:1.5}
#tt{flex-direction:column;gap:2.4vh;text-align:center}
#tt .k{font:400 2.4vh ui-monospace,Menlo,monospace;letter-spacing:.4em;color:var(--c)}
#tt h1{margin:0;font-size:7vh;line-height:1.3;max-width:84vw;letter-spacing:.04em}
#end{flex-direction:column;gap:1.8vh;text-align:center}
#end .f{font-size:5vh;font-weight:700;letter-spacing:.14em}
#end .s{font:400 2.2vh ui-monospace,Menlo,monospace;letter-spacing:.35em;color:var(--c)}
#end img{width:18vw;margin-top:3vh;opacity:.85}
#cap{position:fixed;left:6vw;top:7vh;font:400 3vh "Iowan Old Style",Palatino,Georgia,serif;letter-spacing:.1em;color:#cfc9bd;opacity:0;transition:opacity .5s;z-index:9}
#cap.on{opacity:1}
#sub{position:fixed;left:0;right:0;bottom:8vh;text-align:center;font-size:4.2vh;font-weight:700;letter-spacing:.06em;line-height:1.5;padding:0 8vw;color:#f4efe4;text-shadow:0 2px 14px #000,0 0 30px #000;opacity:0;transition:opacity .4s;z-index:9}
#sub.on{opacity:1}
#white{position:fixed;inset:0;background:#fff;opacity:0;transition:opacity .9s;z-index:20;pointer-events:none}
#white.on{opacity:.8;transition:none}
#fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:5;mix-blend-mode:screen;opacity:0;transition:opacity .8s;pointer-events:none}
#sk .pn{stroke:var(--c)!important;filter:drop-shadow(0 0 6px var(--c))}
#scL{background:radial-gradient(ellipse at 50% 55%,color-mix(in srgb,var(--c) 14%,#000),#000 70%)}
#sc{width:62vw;transform:scale(.92);transition:transform 3.6s cubic-bezier(.2,.6,.2,1)}#scL.on #sc{transform:scale(1.06)}
#sc svg{width:100%;height:auto;overflow:visible}#sc .pn{fill:none;stroke:var(--c);stroke-width:1.6;filter:drop-shadow(0 0 5px var(--c))}#sc text{fill:var(--c);stroke:none}
#chL{flex-direction:column;gap:2.2vh;text-align:center;background:#000}
#chL .no{font:400 2.4vh ui-monospace,Menlo,monospace;letter-spacing:.5em;color:var(--c)}
#chL .nm{font-size:8.4vh;font-weight:700;letter-spacing:.08em;transform:scale(1.08);transition:transform .6s ease-out}#chL.on .nm{transform:scale(1)}
#chL .bar{width:0;height:2px;background:var(--c);transition:width .5s ease-out}#chL.on .bar{width:22vw}
#pf .sweep{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-100%);transition:transform 2.6s ease-in-out .8s}
#pf.dev .sweep{transform:translateX(100%)}
#pf.dev img{transform:scale(1.04);transition:filter 2s cubic-bezier(.3,.6,.2,1),transform 6s ease-out}#pf.dev.z img{transform:scale(1.16)}
#qL{background:#000}#qL .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(24px) brightness(.28);transform:scale(1.2)}
#qL q{position:relative;quotes:none;font-size:5.6vh;font-weight:700;line-height:1.55;max-width:74vw;text-align:center;letter-spacing:.04em}
#qL q::before{content:"";display:block;width:6vw;height:2px;background:var(--c);margin:0 auto 4vh}
#qL q i{font-style:normal;opacity:0;transition:opacity .15s}#qL q i.v{opacity:1}
.crop.gl img{animation:gl .45s steps(3) both}
@keyframes gl{0%{filter:hue-rotate(80deg) saturate(2);transform:scale(2) translateX(-2%)}33%{filter:none;transform:scale(2.05) translateX(1.5%)}66%{filter:contrast(1.6) brightness(1.3);transform:scale(2.1) translateX(-.6%)}100%{filter:none;transform:scale(2.12)}}
.crop::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px)}
#tt{background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--c) 10%,#000) 0%,#000 65%)}
#tt h1{text-shadow:0 0 40px color-mix(in srgb,var(--c) 50%,transparent)}
#end{background:#000}
#sA{background:#000;overflow:hidden}#sA img{width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform 4.2s cubic-bezier(.2,.6,.2,1)}#sA.on img{transform:scale(1.12) translateX(-1.5%)}
#chL .cbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.38) saturate(.9);transform:scale(1.08);transition:transform .9s ease-out}#chL.on .cbg{transform:scale(1)}
#chL .no,#chL .nm,#chL .bar{position:relative}#chL .nm{text-shadow:0 2px 30px #000}
/* ---- 剪輯語法：依片型分 7 種，避免 22 支長得一樣 ---- */
.m-whisper .L,.m-cosmic .L{transition:opacity 1.4s ease}
.m-whisper #sub{font-weight:400;letter-spacing:.14em;font-size:3.8vh;transition:opacity 1s}
.m-cosmic #sub{font-weight:400;letter-spacing:.5em;font-size:2.8vh;bottom:12vh;color:#d9d4c8}
.m-digital #sub{font:400 3.4vh ui-monospace,Menlo,monospace;color:var(--c);letter-spacing:.04em;text-shadow:0 0 12px #000,0 0 2px var(--c)}
.m-digital #sub::after{content:"▍";animation:blk .6s steps(1) infinite}@keyframes blk{50%{opacity:0}}
.m-clock #sub{font-weight:400;letter-spacing:.1em}
.iris{animation:iris .8s cubic-bezier(.3,.6,.2,1) both}@keyframes iris{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(80% at 50% 50%)}}
.glin{animation:glin .4s steps(4) both}@keyframes glin{0%{transform:translateX(-3%);filter:hue-rotate(90deg) saturate(3)}25%{transform:translateX(2%)}50%{transform:none;filter:contrast(1.8)}100%{transform:none;filter:none}}
.bw{filter:grayscale(1) contrast(1.25) brightness(.95)}
.jit{animation:jit .18s steps(2) infinite}@keyframes jit{50%{transform:translate(.15%,-.2%)}}
#it{background:#050505;flex-direction:column}
#it .card{border:3px double #d8d5ce;padding:5vh 7vw;max-width:70vw;text-align:center;font-size:4.6vh;line-height:1.6;letter-spacing:.08em;color:#e9e6df;position:relative}
#it .card::before,#it .card::after{content:"❦";position:absolute;left:50%;transform:translateX(-50%);font-size:3vh;color:#bdb9b0}#it .card::before{top:-2.2vh;background:#050505;padding:0 1vw}#it .card::after{bottom:-2.2vh;background:#050505;padding:0 1vw}
#tt h1 .ch{display:inline-block;opacity:0;transition:opacity .5s,transform .8s;transform:translateY(.3em)}#tt h1 .ch.v{opacity:1;transform:none}
.m-cosmic #tt h1{font-weight:400;letter-spacing:.9em;transition:letter-spacing 3s cubic-bezier(.2,.6,.2,1)}.m-cosmic #tt.on h1{letter-spacing:.3em}
.m-digital #tt h1{font-family:ui-monospace,Menlo,monospace;font-weight:400;color:#f4f4f4}
.pol{background:#f3efe6;padding:2.4vh 2.4vh 9vh;transform:rotate(-3deg);box-shadow:0 20px 60px rgba(0,0,0,.7);position:relative}
.pol img{width:46vh;height:46vh;object-fit:cover;display:block;filter:sepia(.25) contrast(1.05)}
.pol span{position:absolute;left:0;right:0;bottom:2.6vh;text-align:center;color:#2a2620;font-size:3.6vh;font-weight:700;letter-spacing:.06em}
#mem{background:#000}
</style>
<script src="../../data.js"></script>
<script src="../../sketch.js"></script>
<script src="../../score.js"></script>
<script src="../../stories.js"></script>
<script src="../../scene.js"></script>
<script src="fx.js"></script>
</head>
<body>
<canvas id="fx"></canvas>
<div class="L" id="skL"><div id="sk"></div></div>
<div class="L" id="scL"><div id="sc" class="midsk live"></div></div>
<div class="L" id="sA"><img alt=""></div>
<div class="L" id="chL"><div class="cbg"></div><div class="no"></div><div class="nm"></div><div class="bar"></div></div>
<div class="L" id="qL"><div class="bg"></div><q></q></div>
<div class="L" id="pfL"><div id="pf"></div></div>
<div class="L" id="c1"><div class="crop"></div></div>
<div class="L" id="c2"><div class="crop"></div></div>
<div class="L" id="num"><b></b><span></span></div>
<div class="L" id="it"><div class="card"></div></div>
<div class="L" id="mem"><div class="pol"><img alt=""><span></span></div></div>
<div class="L" id="tt"><div class="k"></div><h1></h1></div>
<div class="L" id="end"><div class="f"></div><div class="s">2026 續集　即將上映</div><img src="../../img/logo/mark-dark.svg" alt=""></div>
<div id="cap"></div><div id="sub"></div><div id="white"></div>
<script>
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0'), W=ms=>new Promise(r=>setTimeout(r,ms));
const ACC={1:'#6FB6FF',2:'#E07A5F',3:'#FF4F9A',4:'#E8B04A',5:'#C9A46A',6:'#59D4A0',7:'#9DB8FF',8:'#FF5FD2',9:'#5B9BE0',10:'#FF8A2A',11:'#E07A2B',12:'#3DFF7A',13:'#C46B1C',14:'#FF5A4E',15:'#B48AD6',16:'#5FA8E0',17:'#C9B34A',18:'#FFD84D',19:'#B39C72',20:'#D8D5CE',21:'#C9874A',22:'#E04A3A'};
let ac;
function on(id){ document.querySelectorAll('.L.on').forEach(l=>{ if(l.id!==id) l.classList.remove('on'); }); if(id) $(id).classList.add('on'); }
function sub(t){ const e=$('sub'); if(t){ e.textContent=t; e.classList.add('on'); } else e.classList.remove('on'); }
function cap(t){ const e=$('cap'); if(t){ e.textContent=t; e.classList.add('on'); } else e.classList.remove('on'); }
function white(){ const w=$('white'); w.classList.add('on'); requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.remove('on'))); }
function boom(t=0,f=44,v=.9){ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.setValueAtTime(f*2,ac.currentTime+t); o.frequency.exponentialRampToValueAtTime(f,ac.currentTime+t+.5);
  g.gain.setValueAtTime(0,ac.currentTime+t); g.gain.linearRampToValueAtTime(v,ac.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+2.4); o.connect(g); g.connect(ac.destination); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+2.6); }
function hit(t=0,v=.35){ const n=ac.createBufferSource(), b=ac.createBuffer(1,ac.sampleRate*.25,ac.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  n.buffer=b; const g=ac.createGain(); g.gain.value=v; n.connect(g); g.connect(ac.destination); n.start(ac.currentTime+t); }
function draw(box,total){ const els=[...box.querySelectorAll('.pn')];
  els.forEach((el,i)=>{ let L=300; try{L=Math.ceil(el.getTotalLength())||300}catch(e){} el.style.strokeDasharray=L; el.style.strokeDashoffset=L;
    el.style.transition=`stroke-dashoffset ${total*.6}ms cubic-bezier(.5,.1,.3,1) ${Math.round(i/Math.max(1,els.length)*total*.5)}ms`; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>els.forEach(el=>el.style.strokeDashoffset=0))); }

const fxo=v=>{ $('fx').style.opacity=v; };
/* ---- 音效庫：每種剪輯語法用不同的聲音 ---- */
const T=()=>ac.currentTime;
function env(node,t,v,a,d){ const g=ac.createGain(); g.gain.setValueAtTime(0,T()+t); g.gain.linearRampToValueAtTime(v,T()+t+a); g.gain.exponentialRampToValueAtTime(.0008,T()+t+a+d); node.connect(g); g.connect(ac.destination); return g; }
function tone(t,f,v,a,d,type='sine'){ const o=ac.createOscillator(); o.type=type; o.frequency.value=f; env(o,t,v,a,d); o.start(T()+t); o.stop(T()+t+a+d+.05); return o; }
function noise(t,dur,v,ff=null,q=1){ const n=ac.createBufferSource(), b=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; n.buffer=b;
  let node=n; if(ff){ const f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=q; if(Array.isArray(ff)){ f.frequency.setValueAtTime(ff[0],T()+t); f.frequency.exponentialRampToValueAtTime(ff[1],T()+t+dur); } else f.frequency.value=ff; n.connect(f); node=f; }
  env(node,t,v,dur*.3,dur*.7); n.start(T()+t); n.stop(T()+t+dur+.05); }
const SFX={
  tick:(t=0)=>{ tone(t,2600,.12,.001,.03,'square'); },
  tock:(t=0)=>{ tone(t,1700,.1,.001,.04,'square'); },
  chime:(t=0,f=880)=>{ [1,2.76,5.4].forEach((m,i)=>tone(t,f*m,.18/(i+1),.005,2.6-i*.6)); },
  bell:(t=0)=>{ [0,.9,1.8].forEach(k=>SFX.chime(t+k,523)); },
  shutter:(t=0)=>{ noise(t,.05,.5,4000,.7); noise(t+.07,.06,.4,2500,.7); },
  whoosh:(t=0,d=.7)=>{ noise(t,d,.35,[300,4000],1.2); },
  rise:(t=0,d=1.4)=>{ noise(t,d,.25,[200,6000],2); const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(110,T()+t); o.frequency.exponentialRampToValueAtTime(440,T()+t+d); env(o,t,.05,d*.9,.15); o.start(T()+t); o.stop(T()+t+d+.2); },
  beep:(t=0,f=1320,d=.06)=>{ tone(t,f,.12,.002,d,'square'); },
  key:(t=0)=>{ noise(t,.025,.22,3500,1.5); },
  heart:(t=0)=>{ tone(t,58,.7,.01,.18); tone(t+.22,52,.5,.01,.2); },
  drone:(t=0,d=4,f=55)=>{ tone(t,f,.22,d*.6,d*.6); tone(t,f*1.5,.08,d*.7,d*.5); },
  rewind:(t=0)=>{ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(1200,T()+t); o.frequency.exponentialRampToValueAtTime(80,T()+t+.45); env(o,t,.08,.02,.45); o.start(T()+t); o.stop(T()+t+.55); noise(t,.45,.15,[3000,300],1); },
  projector:(t=0,d=20)=>{ for(let k=0;k<d*18;k++) noise(t+k/18,.02,.06+.03*(k%2),1800,2); },
  static:(t=0,d=.3)=>{ noise(t,d,.25); },
};

async function run(n,hook){
  const a=DATA.find(x=>x.n===n), st=STORIES[n], img=`../../img/poster/${pad(n)}.webp`, C=ACC[n]||'#e8d4a2';
  document.documentElement.style.setProperty('--c',C);
  // 劇情版裡的電影感素材：中場插圖的動畫 CSS、章名、一句金句
  try{ const css=await (await fetch('../../style.css')).text(); const keep=css.split('\n').filter(l=>/^\.midsk(\.live|\s+g\[class\])|^@keyframes a-/.test(l)).join('\n'); const el=document.createElement('style'); el.textContent=keep; document.head.appendChild(el); }catch(e){}
  const lines=st.text.split('\n');
  const chs=lines.filter(l=>l.startsWith('## ')).map(l=>l.slice(3)).filter(t=>!/前情提要|尾聲|終章|終卷/.test(t));
  const pick=[chs[Math.floor(chs.length*.2)],chs[Math.floor(chs.length*.5)],chs[Math.floor(chs.length*.8)]].filter((v,i,ar)=>v&&ar.indexOf(v)===i).slice(0,3);
  const quotes=lines.filter(l=>l.startsWith('> ')).map(l=>l.slice(2).trim()).filter(q=>q.length>=8&&q.length<=30);
  const quote=(quotes.find(q=>!/\d/.test(q))||quotes[0]||'');
  const [h1,h2]=(()=>{ const i=hook.indexOf('。'); return i>0?[hook.slice(0,i+1),hook.slice(i+1)]:[hook,'']; })();
  const numLine=(lines.find(l=>l.startsWith('NUM: '))||'').slice(5).split('｜');
  // 2026 的洞察（預告的主軸）：第一句接住電影，第二句是洞察本身
  const insight=(a.film.reality||'').trim();
  let ins1=(insight.split(/(?<=[。！？])(?!」)/)[0])||insight;
  if(ins1.startsWith('「')&&ins1.includes('」')&&!ins1.endsWith('」')) ins1=ins1.slice(0,ins1.indexOf('」')+1);   // 以台詞開頭的，台詞自成一句
  const ins2=insight.slice(ins1.length).trim();
  const seqTitle=(st.title.split('：')[1]||a.title);
  $('pf').innerHTML=`<img src="${img}" alt=""><div class="sweep"></div>`;
  $('c1').firstElementChild.innerHTML=`<img src="${img}" style="object-position:30% 28%" alt="">`;
  $('c2').firstElementChild.innerHTML=`<img src="${img}" style="object-position:72% 40%" alt="">`;
  $('qL').querySelector('.bg').style.backgroundImage=`url(${img})`;
  $('qL').querySelector('q').innerHTML=[...(ins2||ins1)].map(c=>`<i>${c}</i>`).join('');
  $('tt').querySelector('.k').textContent=`《${a.film.zh}》　${a.film.year} — 2026`;
  $('tt').querySelector('h1').textContent=seqTitle;
  $('end').querySelector('.f').textContent=`《${a.film.zh}》`;
  if(numLine[0]){ $('num').querySelector('b').textContent=numLine[0]; $('num').querySelector('span').textContent=numLine[1]||''; }
  $('sc').innerHTML=window.SCENE?window.SCENE(n):'';
  // 場景圖（img/scene/NN-a/b/c.webp）：有就用，沒有就沿用中場插圖線稿
  const SC=await Promise.all(['a','b','c'].map(x=>new Promise(r=>{ const i=new Image(); i.onload=()=>r(i.src); i.onerror=()=>r(null); i.src=`../../img/scene/${pad(n)}-${x}.webp`; })));
  const P=SC[0]||SC[1]||SC[2], hasSc=!!P;   // 只有一張時，章名底圖改用同一張的不同局部
  if(P) $('sA').querySelector('img').src=P;
  if(P) $('qL').querySelector('.bg').style.backgroundImage=`url(${SC[2]||P})`;
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
  FX.start($('fx'),n,C);
  ac=new AudioContext(); SCORE.play(n,ac,.6);
  // 剪輯語法（依片型）
  const MODE={3:'slam',4:'slam',12:'slam',17:'slam',18:'slam', 2:'whisper',7:'whisper',11:'whisper',15:'whisper',16:'whisper',
    1:'digital',6:'digital',8:'digital',9:'digital',14:'digital', 10:'clock',13:'clock',21:'clock', 5:'cosmic',22:'cosmic', 19:'memento', 20:'silent'}[n]||'slam';
  document.body.classList.add('m-'+MODE);
  const bgs=[SC[1]||P,SC[2]||P,P], crop=['22% 30%','78% 62%','50% 45%'], one=SC.filter(Boolean).length===1;
  const sk=()=>{ $('sk').innerHTML=window.SKETCH(n); const sv=$('sk').querySelector('svg'); sv.removeAttribute('class'); sv.removeAttribute('width'); sv.removeAttribute('height'); };
  const enter=(id,cls)=>{ const el=$(id); el.classList.remove('iris','glin'); void el.offsetWidth; if(cls) el.classList.add(cls); on(id); };
  const chap=(k,c)=>{ const m=c.split('｜'); $('chL').querySelector('.no').textContent=m.length>1?m[0]:''; $('chL').querySelector('.nm').textContent=m[m.length-1];
    const cb=$('chL').querySelector('.cbg'); cb.style.backgroundImage=hasSc&&bgs[k%3]?`url(${bgs[k%3]})`:'none'; cb.style.backgroundSize=one?'190%':'cover'; cb.style.backgroundPosition=one?crop[k%3]:'center'; $('chL').classList.remove('on'); void $('chL').offsetWidth; };
  const scene=(src)=>{ $('sA').querySelector('img').src=src||P; };
  const poster=async(hold,txt)=>{ on('pfL'); requestAnimationFrame(()=>requestAnimationFrame(()=>{ $('pf').classList.add('dev'); setTimeout(()=>$('pf').classList.add('z'),200); })); await W(500); if(txt) sub(txt); await W(hold); sub(''); };
  const typeQ=async(per,snd)=>{ if(!ins2) return; on('qL'); const cs=[...$('qL').querySelectorAll('i')]; for(let i=0;i<cs.length;i++){ cs[i].classList.add('v'); if(snd&&i%2===0) snd(); await W(per); } };
  const typeSub=async(txt,per,snd)=>{ const e=$('sub'); e.classList.add('on'); for(let i=1;i<=[...txt].length;i++){ e.textContent=[...txt].slice(0,i).join(''); if(snd&&i%2) snd(); await W(per); } };
  const letters=(el,txt)=>{ el.innerHTML=[...txt].map(c=>`<span class="ch">${c}</span>`).join(''); return [...el.querySelectorAll('.ch')]; };
  const card=t=>{ $('it').querySelector('.card').textContent=t; };
  const yearCap=`${a.film.year}　《${a.film.zh}》`;
  const flip=async(snd,cls)=>{ $('num').querySelector('b').textContent='2026'; $('num').querySelector('span').textContent='那個未來，就是現在'; sub(''); cap(''); if(snd) snd(); if(cls) enter('num',cls); else on('num'); await W(1100); };

  if(MODE==='slam'){
    sk(); fxo(.9); on('skL'); cap(yearCap); draw($('sk'),2200); SFX.rise(1.4,1.4); await W(2900);
    if(P){ hit(0,.3); on('sA'); fxo(.3); sub(h1); await W(3100); sub(''); } else { hit(0,.25); on('scL'); draw($('sc'),1800); fxo(.55); sub(h1); await W(3100); sub(''); }
    fxo(.85); cap('');
    for(const [k,c] of pick.entries()){ chap(k,c); hit(0,.5); boom(0,60,.35); on('chL'); if(hasSc) await W(700); else { await W(520); on('c'+(k%2+1)); $('c'+(k%2+1)).firstElementChild.classList.add('gl'); await W(130); } }
    await flip(()=>{ boom(0,50,.6); white(); }); fxo(.35); await poster(3200,ins1);
    if(ins2){ fxo(.6); await typeQ(42); await W(1300); }
    SFX.rise(0,.9); await W(900); boom(0,42,1); white(); fxo(.9); on('tt'); await W(2700);
    on('end'); fxo(.5); await W(2200);
  }
  else if(MODE==='whisper'){
    sk(); fxo(.6); on('skL'); cap(yearCap); draw($('sk'),2400); SFX.chime(.6,660); await W(2700);
    if(P){ on('sA'); fxo(.25); } else { on('scL'); draw($('sc'),2200); fxo(.4); } await W(500); sub(h1); await W(3000); sub('');
    cap(''); for(const [k,c] of pick.slice(0,2).entries()){ chap(k+1,c); SFX.heart(0); on('chL'); await W(1500); }
    await flip(()=>SFX.chime(0,880)); fxo(.3); await poster(3000,ins1);
    if(ins2){ await typeQ(70); await W(1300); }
    on('tt'); const L1=letters($('tt').querySelector('h1'),seqTitle); SFX.chime(0,523); SFX.chime(.5,784);
    for(const l of L1){ l.classList.add('v'); await W(110); } fxo(.6); await W(1600);
    on('end'); fxo(.4); await W(2300);
  }
  else if(MODE==='digital'){
    sk(); fxo(.9); on('skL'); cap(yearCap); draw($('sk'),2000); for(let k=0;k<6;k++) SFX.beep(.3+k*.35,1800+k*120,.03); await W(2600);
    SFX.static(0,.25); enter(P?'sA':'scL','glin'); if(!P) draw($('sc'),1600); fxo(.35); await typeSub(h1,45,SFX.key); await W(1300); sub('');
    cap(''); fxo(.85);
    for(const [k,c] of pick.entries()){ chap(k,c); SFX.static(0,.12); SFX.beep(0,880,.05); enter('chL','glin'); await W(330); $('chL').style.opacity=.2; await W(60); $('chL').style.opacity=''; SFX.beep(0,1320,.04); await W(380); }
    await flip(()=>{ SFX.static(0,.2); SFX.beep(0,1980,.1); },'glin'); fxo(.4); on('pfL'); requestAnimationFrame(()=>requestAnimationFrame(()=>$('pf').classList.add('dev','z'))); await W(500); await typeSub(ins1,40,SFX.key); await W(1400); sub('');
    if(ins2){ SFX.static(0,.15); await typeQ(48,SFX.key); await W(1200); }
    on(null); sub(''); await W(450); SFX.static(0,.3); enter('tt','glin'); const L1=letters($('tt').querySelector('h1'),seqTitle); for(const l of L1){ l.classList.add('v'); SFX.key(); await W(70); } SFX.beep(0,1760,.15); fxo(.9); await W(1800);
    SFX.static(0,.2); enter('end','glin'); fxo(.5); await W(2200);
  }
  else if(MODE==='clock'){
    const tk=setInterval(()=>{ SFX.tick(); setTimeout(()=>SFX.tock(),250); },500);
    sk(); fxo(.8); on('skL'); cap(yearCap); draw($('sk'),2300); await W(2900);
    enter(P?'sA':'scL','iris'); if(!P) draw($('sc'),1800); fxo(.35); sub(h1); await W(3000); sub('');
    cap(''); fxo(.75);
    for(const [k,c] of pick.entries()){ chap(k,c); SFX.whoosh(0,.4); enter('chL','iris'); await W(820); }
    await flip(()=>SFX.chime(0,1046),'iris'); fxo(.35); enter('pfL','iris'); requestAnimationFrame(()=>requestAnimationFrame(()=>$('pf').classList.add('dev','z'))); await W(500); sub(ins1); await W(3000); sub('');
    if(ins2){ await typeQ(55); await W(1200); }
    clearInterval(tk); await W(300); SFX.bell(0); enter('tt','iris'); fxo(.85); await W(2900);
    enter('end','iris'); fxo(.4); await W(2200);
  }
  else if(MODE==='cosmic'){
    SFX.drone(0,8,49); sk(); fxo(.9); on('skL'); cap(yearCap); draw($('sk'),2800); await W(3000);
    on(P?'sA':'scL'); if(!P) draw($('sc'),2600); fxo(.3); await W(500); sub(h1); await W(2800); sub('');
    cap(''); const mid=pick[Math.floor(pick.length/2)]; if(mid){ chap(1,mid); SFX.chime(0,330); on('chL'); fxo(.7); await W(1800); }
    await flip(()=>SFX.chime(0,440)); fxo(.25); await poster(3000,ins1);
    if(ins2){ await typeQ(65); await W(1400); }
    SFX.drone(0,7,41); on('tt'); fxo(.9); await W(3600);
    on('end'); fxo(.5); await W(2400);
  }
  else if(MODE==='memento'){
    // 倒敘：從片名的「結局」倒回去，彩色與黑白交錯，每一刀都是拍立得快門
    const pol=(src,t)=>{ $('mem').querySelector('img').src=src; $('mem').querySelector('span').textContent=t; };
    pol(SC[2]||P||img,seqTitle); SFX.shutter(0); white(); on('mem'); fxo(.2); cap(yearCap); await W(1900);
    SFX.rewind(0); await W(450);
    if(ins2){ $('qL').classList.add('bw'); await typeQ(50); await W(700); }
    SFX.shutter(0); white(); $('pfL').classList.remove('bw'); fxo(.2); await poster(2600,ins1);
    cap(''); for(const [k,c] of pick.slice().reverse().entries()){ chap(k,c); SFX.shutter(0); white(); $('chL').classList.toggle('bw',k%2===0); on('chL'); await W(750); }
    SFX.rewind(0); await W(400); $('sA').classList.add('bw'); on(P?'sA':'scL'); sub(h1); await W(2600); sub('');
    sk(); on('skL'); draw($('sk'),1600); await W(1800);
    SFX.shutter(0); white(); on('tt'); fxo(.6); await W(2600);
    on('end'); fxo(.4); await W(2100);
  }
  else if(MODE==='silent'){
    SFX.projector(0,21); ['skL','sA','pfL','chL','tt','end','qL'].forEach(id=>$(id).classList.add('bw','jit'));
    sk(); fxo(1); enter('skL','iris'); cap(yearCap); draw($('sk'),2000); await W(2400);
    cap(''); card(h1); enter('it','iris'); await W(2300);
    if(P){ scene(SC[0]||P); enter('sA','iris'); await W(2200); }
    for(const [k,c] of pick.slice(0,1).entries()){ chap(k+1,c); enter('chL','iris'); await W(1100); }
    $('num').classList.add('bw'); await flip(null,'iris');
    fxo(.8); enter('pfL','iris'); requestAnimationFrame(()=>requestAnimationFrame(()=>$('pf').classList.add('dev','z'))); await W(2600);
    card(ins1); enter('it','iris'); await W(2200);
    if(ins2){ card(ins2); enter('it','iris'); await W(2400); }
    card(seqTitle); $('it').querySelector('.card').style.fontSize='6vh'; enter('it','iris'); SFX.chime(0,392); await W(2600);
    enter('end','iris'); await W(2100);
  }
  SCORE.stop(false); fxo(0); await W(700);
  window.__done=true;
}
window.__start=async()=>{ const n=+new URLSearchParams(location.search).get('n')||12;
  const src=await (await fetch('../../app.js')).text(); const HOOK=JSON.parse(src.match(/const HOOK=(\{.*?\});/)[1]);
  run(n,HOOK[n]); };
</script>
</body>
